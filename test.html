<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>ERO Map Preview</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Plain survey-like column: controls, warning, then the map at survey width. */
:root{--bg:#ffffff;--fg:#222222;--line:#7b8794;--accent:#0b5c8a}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 Arial,Helvetica,sans-serif;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:654px;margin:0 auto;display:grid;gap:14px}
main>*{min-width:0}
p{margin:0}
form{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
label{display:grid;gap:4px;font-size:14px;font-weight:700}
input,select{font:inherit;font-weight:400;padding:7px 9px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--fg);box-sizing:border-box;max-width:100%}
#zip{width:6.5em}
button{font:inherit;cursor:pointer;border-radius:3px}
#show{background:var(--accent);color:#fff;border:1px solid var(--accent);padding:7px 16px;font-weight:700}
#show:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head><body>
<main>
<form id="controls">
<label for="zip">ZIP code<input id="zip" value="73019" inputmode="numeric" maxlength="10" autocomplete="off"></label>
<label for="condition">Map detail randomization<select id="condition"><option value="minimal">Minimal</option><option value="cities">Cities</option><option value="roads">Roads</option><option value="full">Full</option></select></label>
<button id="show" type="submit">Show</button>
</form>
<p><strong>This is a hypothetical scenario created for research. It is not a real forecast.</strong></p>
<div id="map"></div>
</main>
<script src="ero-map.js"></script>
<script>
(function(){
  function show(){
    EROMap.mount(document.getElementById("map"),{
      zip:document.getElementById("zip").value,
      detail:document.getElementById("condition").value
    });
  }
  document.getElementById("controls").addEventListener("submit",function(ev){ev.preventDefault();show();});
  document.getElementById("condition").addEventListener("change",show);
  show();
})();
</script>
</body></html>
